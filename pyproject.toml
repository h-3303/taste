[project]
name = "taste"
version = "0.1.0"
description = "Design taste toolkit: moodboards and a design library"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
taste = "taste.cli:main"

[tool.uv.build-backend]
module-name = "taste"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: needs Playwright Chromium",
    "network: hits the real source (skipped unless --run-network)",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]
